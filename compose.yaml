services:
  postgres:
    image: postgres:17-alpine
    container_name: airops-postgres
    environment:
      POSTGRES_DB: airops
      POSTGRES_USER: airops
      POSTGRES_PASSWORD: airops_dev
    ports:
      - "5433:5432"
    volumes:
      - airops-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airops -d airops"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  airops-postgres-data:
